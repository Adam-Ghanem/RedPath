name: RedPath CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: redpath-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  backend:
    name: Backend quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run backend tests
        run: PYTHONPATH=. pytest -q
      - name: Run Ruff
        run: ruff check app tests
      - name: Run Bandit
        run: bandit -r app -ll
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Audit Python dependencies
        run: python -m pip install pip-audit==2.8.0 && pip-audit -r requirements.txt --strict

  frontend:
    name: Frontend quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Run frontend tests
        run: npm run test -- --run
      - name: Run TypeScript quality gate
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  migration_docs:
    name: Migration and documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate additive migrations
        run: PYTHONPATH=backend python ci/check_migrations.py
      - name: Run migration regression tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_migrations.py
      - name: Validate public documentation
        run: PYTHONPATH=backend python ci/check_docs.py
      - name: Run documentation-check regression tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_release_checks.py

  repository:
    name: Repository quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject whitespace errors
        run: git diff --check
      - name: Scan tracked files for high-risk secret patterns
        run: |
          ! git grep -n -I -E \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,})' \
            -- . ':!docs/github-metadata.md'
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile.demo
          failure-threshold: error

  dependency_review:
    name: SBOM and dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies for audit artifact
        run: python -m pip install --requirement backend/requirements.txt pip-audit==2.8.0
      - name: Generate Python dependency audit artifact
        run: pip-audit -r backend/requirements.txt --format json --output pip-audit.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for audit artifact
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Generate frontend dependency audit artifact
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@v0.18.0
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - name: Generate frontend SPDX SBOM
        uses: anchore/sbom-action@v0.18.0
        with:
          path: ./frontend
          format: spdx-json
          output-file: sbom-frontend.spdx.json
      - name: Upload dependency and SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redpath-dependency-review-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            pip-audit.json
            frontend/npm-audit.json
            sbom-backend.spdx.json
            sbom-frontend.spdx.json

  release_assurance:
    name: Release assurance and recovery evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migration_docs, repository, dependency_review]
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Check lab environment defaults
        run: PYTHONPATH=backend python ci/check_environment.py --profile lab
      - name: Rehearse Alembic lifecycle in temporary database
        run: PYTHONPATH=backend python ci/migration_rehearsal.py | tee migration-rehearsal.txt
      - name: Verify synthetic backup manifest
        run: PYTHONPATH=backend python ci/verify_backup.py --self-test | tee backup-verification.txt
      - name: Validate incident drill matrix
        run: PYTHONPATH=backend python ci/incident_drill.py --all --json > incident-drills.json
      - name: Generate SLO and error-budget report
        run: PYTHONPATH=backend python ci/report_slo.py --input ci/fixtures/slo-sample.json --json > slo-report.json
      - name: Generate release-candidate evidence manifest
        run: PYTHONPATH=backend python ci/release_evidence.py --output release-evidence.json
      - name: Check release-candidate provenance
        run: PYTHONPATH=backend python ci/check_provenance.py release-evidence.json
      - name: Download dependency and SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: redpath-dependency-review-${{ github.sha }}
          path: dependency-artifacts
      - name: Re-check SBOM and dependency artifact provenance
        run: PYTHONPATH=backend python ci/check_provenance.py release-evidence.json --artifact-root dependency-artifacts
      - name: Upload release assurance evidence
        uses: actions/upload-artifact@v4
        with:
          name: redpath-release-assurance-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release-evidence.json
            migration-rehearsal.txt
            backup-verification.txt
            incident-drills.json
            slo-report.json

  containers:
    name: Container build and vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend, migration_docs, repository, dependency_review, release_assurance]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull --tag redpath-api:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build --pull --tag redpath-console:${{ github.sha }} --file frontend/Dockerfile.demo ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: redpath-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: redpath-console:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  release_verify:
    name: Release verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend, migration_docs, repository, dependency_review, release_assurance, containers]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Run release verification
        run: PYTHONPATH=backend python ci/release_verify.py | tee release-verification.txt
      - name: Upload release verification result
        uses: actions/upload-artifact@v4
        with:
          name: redpath-release-verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: release-verification.txt
