services:
  api:
    profiles: ["demo"]
    build: ./backend
    environment:
      # Literal values are deliberate: the demo API cannot be switched out of dry-run mode by host variables.
      DATABASE_URL: sqlite:///./data/redpath.db
      ALLOWED_CIDRS: 192.0.2.0/24,198.51.100.0/24
      DRY_RUN: "true"
      AUDIT_LOG_PATH: ./data/audit.jsonl
    volumes:
      - redpath-demo-data:/app/data
    ports:
      - "8000:8000"

  console:
    profiles: ["demo"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  redpath-demo-data:
